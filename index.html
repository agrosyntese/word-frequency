<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Word Frequency</title>
  </head>
  <body>
    <main class="container">
      <h1>Word Frequency</h1>
      <p class="subtitle">Cole um texto e veja quantas vezes cada palavra aparece.</p>

      <form id="text-form" novalidate>
        <label for="text-input">Texto para analisar</label>
        <textarea
          id="text-input"
          rows="10"
          maxlength="2048"
          placeholder="Digite ou cole seu texto aqui (máx. 2048 caracteres)"
          aria-describedby="char-counter"
        ></textarea>
        <div class="form-meta">
          <p id="error-message" class="error" role="alert" hidden></p>
          <p id="char-counter" class="counter">0 / 2048</p>
        </div>
        <label class="checkbox">
          <input type="checkbox" id="stopwords-toggle" />
          Ignorar palavras comuns <span class="hint">(o, de, que, the, and…)</span>
        </label>
        <div class="actions">
          <button type="submit" class="btn btn-primary">Translate</button>
          <button type="button" id="clear-button" class="btn btn-secondary">Limpar</button>
          <span class="hint">ou <kbd>Ctrl</kbd> + <kbd>Enter</kbd></span>
        </div>
      </form>

      <section aria-labelledby="results-title">
        <h2 id="results-title">Frequência das palavras</h2>
        <p id="summary" class="summary" aria-live="polite"></p>
        <figure id="chart-container" class="chart" hidden>
          <figcaption class="chart-header">
            <span id="chart-caption"></span>
            <span class="view-toggle" role="group" aria-label="Tipo de gráfico">
              <button type="button" data-view="bar" aria-pressed="true">Barras</button>
              <button type="button" data-view="cloud" aria-pressed="false">Nuvem</button>
            </span>
          </figcaption>
          <div id="bar-wrapper" class="chart-canvas">
            <canvas id="bar-chart" role="img"></canvas>
          </div>
          <div id="cloud-wrapper" class="chart-canvas chart-cloud" hidden>
            <canvas id="cloud-chart" role="img"></canvas>
          </div>
        </figure>
        <div id="table-toolbar" class="table-toolbar" hidden>
          <label for="filter-input" class="visually-hidden">Filtrar palavras da tabela</label>
          <input type="search" id="filter-input" placeholder="Filtrar palavras…" autocomplete="off" />
          <span id="filter-status" class="filter-status" aria-live="polite"></span>
          <button type="button" id="export-button" class="btn btn-secondary">Exportar CSV</button>
        </div>
        <div class="table-wrapper">
          <table id="frequency-table">
            <thead>
              <tr>
                <th scope="col">Palavra</th>
                <th scope="col">Frequência</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
